name: Nemo v3 Signing State — Read-Only Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/nemo-v3-signing-state-diagnostics-pr.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: nemo-v3-signing-state-diag-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Recent signing runs and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_PATH: reports/nemo-v3-signing-state.json
    steps:
      - name: Query recent workflow runs and artifacts
        id: query
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]

          def api(path):
              proc = subprocess.run(
                  ["gh", "api", path],
                  check=False,
                  capture_output=True,
                  text=True,
                  env=os.environ,
              )
              try:
                  payload = json.loads(proc.stdout) if proc.stdout.strip() else None
              except json.JSONDecodeError:
                  payload = proc.stdout[:2000]
              return {
                  "ok": proc.returncode == 0,
                  "payload": payload,
                  "stderr": proc.stderr.strip()[:2000],
              }

          runs_result = api(
              f"repos/{repo}/actions/workflows/nemo-v3-exact-signing-handoff.yml/runs?per_page=30"
          )
          raw_runs = (
              runs_result["payload"].get("workflow_runs", [])
              if runs_result["ok"] and isinstance(runs_result["payload"], dict)
              else []
          )
          runs = []
          for item in raw_runs:
              run = {
                  "id": item.get("id"),
                  "event": item.get("event"),
                  "status": item.get("status"),
                  "conclusion": item.get("conclusion"),
                  "head_branch": item.get("head_branch"),
                  "head_sha": item.get("head_sha"),
                  "run_number": item.get("run_number"),
                  "run_attempt": item.get("run_attempt"),
                  "created_at": item.get("created_at"),
                  "updated_at": item.get("updated_at"),
                  "html_url": item.get("html_url"),
                  "artifacts": [],
              }
              artifacts = api(f"repos/{repo}/actions/runs/{item.get('id')}/artifacts?per_page=100")
              if artifacts["ok"] and isinstance(artifacts["payload"], dict):
                  run["artifacts"] = [
                      {
                          "id": artifact.get("id"),
                          "name": artifact.get("name"),
                          "size_in_bytes": artifact.get("size_in_bytes"),
                          "expired": artifact.get("expired"),
                          "digest": artifact.get("digest"),
                      }
                      for artifact in artifacts["payload"].get("artifacts", [])
                  ]
              runs.append(run)

          report = {
              "schema": "szl.nemo-v3-signing-state-diagnostics/v1",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "repository": repo,
              "workflow_query_ok": runs_result["ok"],
              "workflow_query_error": runs_result.get("stderr"),
              "runs": runs,
          }
          path = Path(os.environ["REPORT_PATH"])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          production = next(
              (
                  run
                  for run in runs
                  if run["event"] in {"push", "workflow_run"}
                  and run["status"] in {"queued", "in_progress", "completed"}
              ),
              None,
          )
          if production:
              event = re.sub(r"[^a-z0-9]+", "-", production["event"].lower()).strip("-")
              conclusion = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  str(production["conclusion"] or production["status"]).lower(),
              ).strip("-")
              slug = (
                  f"nemo-sign-r{production['id']}-{event}-{conclusion}"
                  f"-a{len(production['artifacts'])}"
              )
          else:
              slug = "nemo-sign-no-production-run"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"slug={slug}\n")
          print(json.dumps({"slug": slug, "runs": runs}, indent=2, sort_keys=True))

      - name: Upload immutable diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.query.outputs.slug || format('nemo-sign-diag-{0}', github.run_id) }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 30
